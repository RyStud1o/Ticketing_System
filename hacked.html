<!DOCTYPE html>

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
    body {
      font-family: 'Share Tech Mono', monospace;
      background-color: #000;
      color: #f00;
      overflow: hidden;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    .crt::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 2;
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
    }
    .glitch {
      animation: glitch-skew 1s infinite linear alternate-reverse;
    }
    @keyframes glitch-skew {
      0% { transform: skew(0deg); text-shadow: 2px 0 red, -2px 0 blue; }
      20% { transform: skew(-10deg); text-shadow: -2px 0 red, 2px 0 blue; }
      40% { transform: skew(10deg); text-shadow: 2px 0 red, -2px 0 blue; }
      60% { transform: skew(-5deg); text-shadow: -2px 0 red, 2px 0 blue; }
      80% { transform: skew(5deg); text-shadow: 2px 0 red, -2px 0 blue; }
      100% { transform: skew(0deg); text-shadow: -2px 0 red, 2px 0 blue; }
    }
    #terminal-container {
      scrollbar-width: none;
    }
    #terminal-container::-webkit-scrollbar {
      display: none; 
    }
    .blink { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body class="crt h-screen w-screen flex flex-col p-6" oncontextmenu="return false;">

  <div class="flex-1 w-full max-w-4xl mx-auto flex flex-col relative z-10">
    
    <div class="border-b-2 border-red-700 pb-4 mb-6 flex justify-between items-end">

    </div>

    </div>

    <div class="flex-1 bg-zinc-950 border border-red-900 rounded p-4 font-mono text-xs md:text-sm overflow-hidden flex flex-col justify-end shadow-inner">
      <div id="terminal-container" class="overflow-y-auto space-y-1.5 w-full text-red-500 pb-4 flex-1 flex flex-col justify-end">

      <p class="text-red-400 mt-2">> <span class="blink">_</span></p>

      <p>UID: 9482-A8F-001</p>
      <p class="animate-pulse">NETWORK ERROR</p>
    </div>
  </div>

  <script>
    document.onkeydown = function(e) {
      if(event.keyCode == 123) { return false; }
      if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) { return false; }
      if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) { return false; }
      if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) { return false; }
      if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { return false; }
    }

    const logs = [
      "[SYSTEM] Connection socket established from external IP: 185.220.101.52",
      "[KERNEL] Bypassing secure root authentication...",
      "[SUCCESS] Root privileges granted via zero-day exploit.",
      "[ALERT] Dumping Local Storage Database...",
      "[ENCRYPT] Extracting Database...",
      "[ENCRYPT] Overwriting file system sectors with AES-256-GCM...",
      "[NETWORK] Exfiltrating data to remote server...",
      "...",
      "Data exfiltration complete (100%).",
      "Deleting local backups...",
      "Erasing system logs...",
      "Overriding UI parameters...",
      "[FATAL ERROR] Master boot record corrupted.",
      "System shutdown initiated."
    ];

    const container = document.getElementById('terminal-container');
    let logIndex = 0;

    function processLogs() {
      if (logIndex < logs.length) {
        const p = document.createElement('p');
        p.textContent = logs[logIndex];
        container.appendChild(p);
        container.scrollTop = container.scrollHeight;
        
        logIndex++;
        setTimeout(processLogs, Math.random() * 1200 + 300);
      } else {
        setInterval(() => {
            const hex = Math.floor(Math.random()*16777215).toString(16).padStart(6, '0').toUpperCase();

            p.textContent = `[SYSTEM FAILURE] Memory leak at 0x${hex} - DEAD SYSTEM`;
            p.style.opacity = '0.5';

            container.scrollTop = container.scrollHeight;

  </script>
</body>
